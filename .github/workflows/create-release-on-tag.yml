name: Create Release on tag

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
      CF_GAME_VERSIONS: ${{ vars.CF_GAME_VERSIONS }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Prepare release details
        shell: bash
        run: |
          echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          echo "COMMIT_MESSAGE=$(git log -1 --pretty=%s)" >> "$GITHUB_ENV"

      - name: Build CurseForge ZIP
        run: python3 Updater/build_release.py --output NpcAbilitiesForever.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG_NAME" NpcAbilitiesForever.zip --title "$TAG_NAME" --notes "$COMMIT_MESSAGE"

      - name: Upload to CurseForge
        if: env.CF_API_TOKEN != '' && env.CF_PROJECT_ID != ''
        run: sh Updater/cf-upload.sh "$TAG_NAME" "$COMMIT_MESSAGE"

      - name: Skip CurseForge upload until project settings are configured
        if: env.CF_API_TOKEN == '' || env.CF_PROJECT_ID == ''
        run: echo "GitHub release created; configure CF_API_TOKEN and your own CF_PROJECT_ID to enable CurseForge uploads."
